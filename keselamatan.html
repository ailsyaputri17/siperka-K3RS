<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pemantauan Risiko Keselamatan K3RS</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="header">

    <div class="header-content">

        <div class="logo">
            K3RS
        </div>

        <div>

            <h1>
                Pemantauan Risiko
            </h1>

            <p>
                Keselamatan
            </p>

        </div>

    </div>

</header>


<main class="form-container">

    <div class="form-card">

        <h2>
            Formulir Pemantauan Risiko Keselamatan
        </h2>

        <p class="form-description">
            Silakan lengkapi data pemantauan dengan benar.
        </p>


        <form onsubmit="simpanPemantauan(event)">


            <!-- TANGGAL -->

            <div class="form-group">

                <label for="tanggal">
                    Tanggal Pemantauan *
                </label>

                <input
                    type="date"
                    id="tanggal"
                    required>

            </div>


            <!-- PETUGAS -->

            <div class="form-group">

                <label for="petugas">
                    Nama Petugas *
                </label>

                <input
                    type="text"
                    id="petugas"
                    placeholder="Masukkan nama petugas"
                    required>

            </div>


            <!-- UNIT -->

            <div class="form-group">

                <label for="unit">
                    Unit / Bagian *
                </label>

                <input
                    type="text"
                    id="unit"
                    placeholder="Masukkan unit atau bagian"
                    required>

            </div>


            <!-- LOKASI -->

            <div class="form-group">

                <label for="lokasi">
                    Area / Lokasi *
                </label>

                <input
                    type="text"
                    id="lokasi"
                    placeholder="Contoh: Koridor ruang rawat"
                    required>

            </div>


            <!-- RISIKO -->

            <div class="form-group">

                <label for="risiko">
                    Potensi Risiko Keselamatan *
                </label>

                <textarea
                    id="risiko"
                    placeholder="Tuliskan potensi risiko yang ditemukan"
                    required></textarea>

            </div>


            <!-- DAMPAK -->

            <div class="form-group">

                <label for="dampak">
                    Dampak *
                </label>

                <textarea
                    id="dampak"
                    placeholder="Tuliskan dampak yang mungkin terjadi"
                    required></textarea>

            </div>


            <!-- PENGENDALIAN -->

            <div class="form-group">

                <label for="pengendalian">
                    Pengendalian *
                </label>

                <textarea
                    id="pengendalian"
                    placeholder="Tuliskan pengendalian yang sudah dilakukan"
                    required></textarea>

            </div>


            <!-- HASIL -->

            <div class="form-group">

                <label for="hasil">
                    Hasil Pemantauan *
                </label>

                <textarea
                    id="hasil"
                    placeholder="Tuliskan hasil pemantauan"
                    required></textarea>

            </div>


            <!-- REKOMENDASI -->

            <div class="form-group">

                <label for="rekomendasi">
                    Rekomendasi *
                </label>

                <textarea
                    id="rekomendasi"
                    placeholder="Tuliskan rekomendasi perbaikan"
                    required></textarea>

            </div>


            <!-- FOTO BEFORE -->

            <div class="form-group">

                <label for="fotoBefore">
                    Foto Before
                </label>

                <input
                    type="file"
                    id="fotoBefore"
                    accept="image/*">

                <small>
                    Upload foto kondisi sebelum dilakukan perbaikan.
                </small>

                <div id="previewBefore"></div>

            </div>


            <!-- FOTO AFTER -->

            <div class="form-group">

                <label for="fotoAfter">
                    Foto After
                </label>

                <input
                    type="file"
                    id="fotoAfter"
                    accept="image/*">

                <small>
                    Upload foto kondisi setelah dilakukan perbaikan.
                </small>

                <div id="previewAfter"></div>

            </div>


            <!-- TOMBOL -->

            <button
                type="submit"
                class="btn-submit"
                id="btnSimpan">

                SIMPAN PEMANTAUAN

            </button>


        </form>


        <a
            href="index.html"
            class="btn-back">

            ← Kembali ke Halaman Utama

        </a>


    </div>

</main>


<script>


/* =====================================================
   URL GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz9ZhXgU-YEWyMcIvepCwfFQG7yzP0dXrxoo9jgBicvxZCmzU4-M5z_jOzZ45_pr4wEMQ/exec";


/* =====================================================
   PREVIEW FOTO BEFORE
   ===================================================== */

document
    .getElementById("fotoBefore")
    .addEventListener("change", function () {

        tampilkanPreview(
            this,
            "previewBefore"
        );

    });


/* =====================================================
   PREVIEW FOTO AFTER
   ===================================================== */

document
    .getElementById("fotoAfter")
    .addEventListener("change", function () {

        tampilkanPreview(
            this,
            "previewAfter"
        );

    });


/* =====================================================
   FUNGSI PREVIEW
   ===================================================== */

function tampilkanPreview(input, targetId) {

    const target =
        document.getElementById(targetId);

    target.innerHTML = "";


    if (
        !input.files ||
        !input.files[0]
    ) {

        return;

    }


    const file =
        input.files[0];


    if (
        !file.type.startsWith("image/")
    ) {

        alert(
            "File harus berupa gambar."
        );

        input.value = "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload = function (event) {

        const img =
            document.createElement("img");


        img.src =
            event.target.result;


        img.style.maxWidth =
            "250px";

        img.style.maxHeight =
            "250px";

        img.style.marginTop =
            "10px";

        img.style.borderRadius =
            "8px";


        target.appendChild(img);

    };


    reader.readAsDataURL(file);

}


/* =====================================================
   UBAH FILE MENJADI BASE64
   ===================================================== */

function fileToBase64(file) {

    return new Promise(function(resolve, reject) {

        if (!file) {

            resolve("");

            return;

        }


        const reader =
            new FileReader();


        reader.onload = function() {

            resolve(
                reader.result
            );

        };


        reader.onerror = function(error) {

            reject(error);

        };


        reader.readAsDataURL(file);

    });

}


/* =====================================================
   SIMPAN PEMANTAUAN
   ===================================================== */

async function simpanPemantauan(event) {

    event.preventDefault();


    /* -------------------------------------------------
       AMBIL DATA FORM
       ------------------------------------------------- */

    const tanggal =
        document
        .getElementById("tanggal")
        .value;


    const petugas =
        document
        .getElementById("petugas")
        .value
        .trim();


    const unit =
        document
        .getElementById("unit")
        .value
        .trim();


    const lokasi =
        document
        .getElementById("lokasi")
        .value
        .trim();


    const risiko =
        document
        .getElementById("risiko")
        .value
        .trim();


    const dampak =
        document
        .getElementById("dampak")
        .value
        .trim();


    const pengendalian =
        document
        .getElementById("pengendalian")
        .value
        .trim();


    const hasil =
        document
        .getElementById("hasil")
        .value
        .trim();


    const rekomendasi =
        document
        .getElementById("rekomendasi")
        .value
        .trim();


    /* -------------------------------------------------
       FILE FOTO
       ------------------------------------------------- */

    const fileBefore =
        document
        .getElementById("fotoBefore")
        .files[0];


    const fileAfter =
        document
        .getElementById("fotoAfter")
        .files[0];


    /* -------------------------------------------------
       VALIDASI DATA
       ------------------------------------------------- */

    if (
        !tanggal ||
        !petugas ||
        !unit ||
        !lokasi ||
        !risiko ||
        !dampak ||
        !pengendalian ||
        !hasil ||
        !rekomendasi
    ) {

        alert(
            "Mohon lengkapi semua data terlebih dahulu."
        );

        return;

    }


    /* -------------------------------------------------
       VALIDASI UKURAN FOTO
       ------------------------------------------------- */

    const batasUkuran =
        5 * 1024 * 1024;


    if (
        fileBefore &&
        fileBefore.size > batasUkuran
    ) {

        alert(
            "Foto Before terlalu besar. Maksimal 5 MB."
        );

        return;

    }


    if (
        fileAfter &&
        fileAfter.size > batasUkuran
    ) {

        alert(
            "Foto After terlalu besar. Maksimal 5 MB."
        );

        return;

    }


    /* -------------------------------------------------
       TOMBOL
       ------------------------------------------------- */

    const tombol =
        document
        .getElementById("btnSimpan");


    tombol.disabled = true;

    tombol.textContent =
        "MENYIMPAN...";


    try {


        /* ---------------------------------------------
           KONVERSI FOTO
           --------------------------------------------- */

        tombol.textContent =
            "MEMPROSES FOTO...";


        const fotoBefore =
            await fileToBase64(
                fileBefore
            );


        const fotoAfter =
            await fileToBase64(
                fileAfter
            );


        /* ---------------------------------------------
           DATA YANG DIKIRIM
           --------------------------------------------- */

        const data = {

            jenisPemantauan:
                "Keselamatan",

            tanggalPemantauan:
                tanggal,

            namaPetugas:
                petugas,

            ruangan:
                unit,

            areaLokasi:
                lokasi,

            potensiRisiko:
                risiko,

            dampak:
                dampak,

            pengendalian:
                pengendalian,

            hasilPemantauan:
                hasil,

            rekomendasi:
                rekomendasi,

            status:
                "Belum Diverifikasi",

            fotoBefore:
                fotoBefore,

            fotoAfter:
                fotoAfter

        };


        /* ---------------------------------------------
           KIRIM KE APPS SCRIPT
           --------------------------------------------- */

        tombol.textContent =
            "MENYIMPAN DATA...";


        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    redirect: "follow",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(data)

                }
            );


        const hasilResponse =
            await response.text();


        console.log(
            "Response Apps Script:",
            hasilResponse
        );


        /* ---------------------------------------------
           PARSE RESPONSE
           --------------------------------------------- */

        let hasilJSON;


        try {

            hasilJSON =
                JSON.parse(
                    hasilResponse
                );

        } catch (error) {

            hasilJSON = null;

        }


        /* ---------------------------------------------
           BERHASIL
           --------------------------------------------- */

        if (
            hasilJSON &&
            hasilJSON.status === "success"
        ) {

            alert(

                "✅ Data pemantauan berhasil disimpan!\n\n" +

                "ID: " +
                hasilJSON.id +
                "\n\n" +

                "Data telah masuk ke Spreadsheet " +
                "dan foto telah diproses."

            );


            /* -----------------------------------------
               KOSONGKAN FORM
               ----------------------------------------- */

            document
                .querySelector("form")
                .reset();


            document
                .getElementById("previewBefore")
                .innerHTML = "";


            document
                .getElementById("previewAfter")
                .innerHTML = "";


        } else {

            alert(

                "❌ Data belum berhasil disimpan.\n\n" +

                (
                    hasilJSON &&
                    hasilJSON.message
                    ?
                    hasilJSON.message
                    :
                    hasilResponse
                )

            );

        }


    } catch (error) {


        console.error(
            "Kesalahan:",
            error
        );


        alert(

            "❌ Gagal mengirim data.\n\n" +

            error.message

        );


    }


    /* -------------------------------------------------
       KEMBALIKAN TOMBOL
       ------------------------------------------------- */

    tombol.disabled = false;

    tombol.textContent =
        "SIMPAN PEMANTAUAN";

}

</script>


</body>

</html>
